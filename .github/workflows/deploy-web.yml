name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar o motor
        run: node web/test/selfplay.mjs
      - name: Testar o multiplayer (loopback)
        run: node web/test/netplay.mjs
      - name: Auditar regras jogada a jogada
        run: node web/test/audit.mjs
      - name: Carimbar a versão nos imports (cache-busting)
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/__V__/$V/g" web/index.html web/js/*.js
          echo "Versão carimbada: $V"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

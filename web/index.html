<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sueca</title>
<meta name="description" content="Joga Sueca no browser — sozinho contra bots ou online com amigos, sem instalar nada.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>Sueca</h1>
    <p class="tagline">O clássico português — sozinho contra bots ou online com amigos.</p>
    <input id="name" placeholder="O teu nome" maxlength="14" autocomplete="off">
    <button id="start-single" class="primary">Jogar Sozinho (vs Bots)</button>
    <button id="start-host" class="primary alt">Criar Sala Online</button>
    <div class="join-row">
      <input id="join-code" placeholder="Código" maxlength="6" autocomplete="off">
      <button id="start-join" class="primary alt">Entrar na Sala</button>
    </div>
    <p class="error" id="menu-error"></p>
    <p class="hint">Tens de assistir ao naipe. Ás vale 11, sete vale 10 —
    120 pontos em cada ronda, partida à melhor de 4 jogos.</p>
  </div>
</div>

<div id="lobby" class="overlay" hidden>
  <div class="panel">
    <h2>Sala de Espera</h2>
    <div id="room-code" title="Clica para copiar o convite"></div>
    <p class="hint" id="room-hint">Partilha o código (ou clica nele para copiar o link de convite).</p>
    <div id="lobby-seats"></div>
    <p class="hint" id="lobby-info"></p>
    <button id="lobby-start" class="primary" hidden>Começar Jogo</button>
    <button id="lobby-leave" class="ghost">Sair</button>
  </div>
</div>

<main id="table" hidden>
  <header id="topbar">
    <div class="team">
      <span class="tname">Nós</span>
      <span class="dots" id="dots-us"></span>
      <span class="pts" id="pts-us">0</span>
    </div>
    <div id="trumpbox" hidden>
      <span class="tname">Trunfo</span>
      <span id="trumpcard"></span>
    </div>
    <div class="team">
      <span class="pts" id="pts-them">0</span>
      <span class="dots" id="dots-them"></span>
      <span class="tname">Eles</span>
    </div>
  </header>

  <section id="felt">
    <div class="seat" id="seatbox-2">
      <div class="plate" id="plate-2"></div>
      <div class="backs" id="backs-2"></div>
    </div>
    <div class="seat side" id="seatbox-1">
      <div class="plate" id="plate-1"></div>
      <div class="backs vert" id="backs-1"></div>
    </div>
    <div id="pile">
      <div class="slot s-top" id="slot-2"></div>
      <div class="slot s-left" id="slot-1"></div>
      <div class="slot s-right" id="slot-3"></div>
      <div class="slot s-bottom" id="slot-0"></div>
      <div id="banner" hidden></div>
    </div>
    <div class="seat side" id="seatbox-3">
      <div class="plate" id="plate-3"></div>
      <div class="backs vert" id="backs-3"></div>
    </div>
    <div class="seat" id="seatbox-0">
      <div id="hand"></div>
      <div class="plate" id="plate-0"></div>
    </div>
  </section>
</main>

<div id="round-overlay" class="overlay" hidden>
  <div class="panel">
    <h2 id="round-title"></h2>
    <div id="round-detail"></div>
    <button id="round-continue" class="primary"></button>
  </div>
</div>

<script src="vendor/peerjs.min.js"></script>
<script type="module" src="js/ui.js"></script>
</body>
</html>
